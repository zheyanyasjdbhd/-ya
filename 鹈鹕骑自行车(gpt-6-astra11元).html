<script>
const scene = document.getElementById('scene');
const svg = scene.querySelector('svg');
const toggle = document.getElementById('toggle');
const speed = document.getElementById('speed');
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rate = 1, time = 0, last = null;
const rider = svg.querySelector('.rider');
const arms = document.getElementById('crank-arms');
const wheels = [...svg.querySelectorAll('.wheel')];
const legs = [svg.querySelector('.front-leg'), svg.querySelector('.back-leg')];
const feet = [svg.querySelector('.foot-front'), svg.querySelector('.foot-back')];
scene.classList.add('motion-enabled');
// 背景 CSS 动画也交给同一时间轴，避免暂停、调速产生相位差。
const ambience = scene.getAnimations();
ambience.forEach(a => a.pause());
function draw() {
  const angle = time * Math.PI * 2 / 1.6;
  const bob = -1.5 + 1.5 * Math.cos(angle * 2);
  rider.setAttribute('transform', `translate(0 ${bob})`);
  const points = [];
  for (let i = 0; i < 2; i++) {
    const a = angle + i * Math.PI;
    const px = 485 - 30 * Math.sin(a), py = 384 + 30 * Math.cos(a);
    // 脚底 y=9，因此踝关节比踏板高 9px。
    const ax = px, ay = py - 9, hx = 469 - i * 9, hy = 302 + bob;
    const dx = ax - hx, dy = ay - hy, dist = Math.hypot(dx, dy);
    // 固定长度双连杆逆运动学：大腿 57px、小腿 62px。
    const along = (57 * 57 - 62 * 62 + dist * dist) / (2 * dist);
    const height = Math.sqrt(Math.max(0, 57 * 57 - along * along));
    const kx = hx + along * dx / dist + height * dy / dist;
    const ky = hy + along * dy / dist - height * dx / dist;
    legs[i].setAttribute('d', `M${hx} ${hy}L${kx} ${ky}L${ax} ${ay}`);
    feet[i].setAttribute('transform', `translate(${ax} ${ay})`);
    points.push([px, py]);
  }
  arms.setAttribute('d', `M${points[0].join(' ')}L485 384L${points[1].join(' ')}`);
  wheels.forEach(w => w.setAttribute('transform', `rotate(${angle * 180 / Math.PI})`));
  ambience.forEach(a => { a.currentTime = time * 1000; });
}
function setPaused(value) {
  paused = value;
  toggle.textContent = paused ? '▶ 播放' : 'Ⅱ 暂停';
  toggle.setAttribute('aria-pressed', String(paused));
}
toggle.addEventListener('click', () => setPaused(!paused));
speed.addEventListener('input', () => {
  rate = Number(speed.value);
  document.getElementById('speedValue').textContent = `${rate.toFixed(2)}×`;
});
document.addEventListener('visibilitychange', () => { last = null; });
function frame(now) {
  if (last !== null && !paused) time += Math.min((now - last) / 1000, 0.05) * rate;
  last = now;
  draw();
  requestAnimationFrame(frame);
}
setPaused(paused);
draw();
requestAnimationFrame(frame);
</script>
